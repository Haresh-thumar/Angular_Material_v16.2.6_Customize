<h1>Mat Checkbox Customize</h1>
<br>
<!------------------------------------------------------------------------------------
                            Checkbox ByDefault Theme Color
------------------------------------------------------------------------------------->
<section class="example-section">
    <h3 style="margin-bottom: -10px; color: red; font-weight: 600;">ByDefault Theme Color</h3>
    <mat-checkbox color="accent">Checkbox 1</mat-checkbox>
    <mat-checkbox color="primary">Checkbox 2</mat-checkbox>
    <mat-checkbox color="warn">Checkbox 3</mat-checkbox>
    <mat-checkbox color="accent" disabled checked>Checkbox 3</mat-checkbox>
</section>
<section class="example-section">
    <mat-checkbox class="example-margin">Check me!</mat-checkbox>
    <mat-checkbox class="example-margin" [disabled]="true">Disabled</mat-checkbox>
</section>
<!------------------------------------------------------------------------------------
                                Indeterminate Checkbox
------------------------------------------------------------------------------------->
<section class="example-section">
    <h3 style="margin-bottom: -10px; color: red; font-weight: 600;">Indeterminate Checkbox</h3>
    <span class="example-list-section">
        <mat-checkbox class="example-margin"
            [checked]="allComplete"
            [color]="task.color"
            [indeterminate]="someComplete()"
            (change)="setAll($event.checked)"> {{task.name}} </mat-checkbox>
    </span>
    <span class="example-list-section">
        <ul>
            <li *ngFor="let subtask of task.subtasks">
                <mat-checkbox [(ngModel)]="subtask.completed"
                    [color]="subtask.color"
                    (ngModelChange)="updateAllComplete()"> {{subtask.name}} </mat-checkbox>
            </li>
        </ul>
    </span>
</section>
<!------------------------------------------------------------------------------------
                                Checkbox Custom Color
------------------------------------------------------------------------------------->
<section class="example-section">
    <h3 style="margin-bottom: -10px; color: red; font-weight: 600;">Custom Color</h3>
    <mat-checkbox color="success">Checkbox 4</mat-checkbox>
    <mat-checkbox color="warning">Checkbox 5</mat-checkbox>
    <mat-checkbox color="info">Checkbox 6</mat-checkbox>
    <mat-checkbox color="teal">Checkbox 7</mat-checkbox>
</section>
