<h1 class="heading">Mat Button Customize</h1>
<br><br>
<!---------------------------------------------------------------------------------------------
                                        Basic Button
---------------------------------------------------------------------------------------------->
<section>
    <div class="example-label">Basic</div>
    <div class="example-button-row">
        <div class="example-flex-container">
            <button mat-button>Basic</button>
            <button mat-button color="primary">Primary</button>
            <button mat-button color="accent">Accent</button>
            <button mat-button color="warn">Warn</button>
            <button mat-button disabled>Disabled</button>
            <a mat-button href="https://www.google.com/" target="_blank">Link</a>
        </div>
    </div>
</section><br><br>
<mat-divider></mat-divider>
<br><br>

---------------------------------------------------------------------------------------------->

                                            Icon Button
---------------------------------------------------------------------------------------------->
<section>
    <div class="example-label">Icon</div>
    <div class="example-button-row">
        <div class="example-flex-container">
            <button mat-icon-button>
                <mat-icon>more_vert</mat-icon>
            </button>
            <button mat-icon-button color="primary">
                <mat-icon>home</mat-icon>
            </button>
            <button mat-icon-button color="accent">
                <mat-icon>menu</mat-icon>
            </button>
            <button mat-icon-button color="warn">
                <mat-icon>favorite</mat-icon>
            </button>
            <button mat-icon-button disabled>
                <mat-icon>open_in_new</mat-icon>
            </button>
        </div>
    </div>
</section>
<br><br>
<mat-divider></mat-divider>
<br><br>
<!---------------------------------------------------------------------------------------------
                                            FAB Button
---------------------------------------------------------------------------------------------->
<section>
    <div class="example-label">FAB</div>
    <div class="example-button-row">
        <div class="example-flex-container">
            <div class="example-button-container">
                <button mat-fab color="primary" class="matFab1">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>
            <div class="example-button-container">
                <button mat-fab color="accent" class="matFab2">
                    <mat-icon>bookmark</mat-icon>
                </button>
            </div>
            <div class="example-button-container">
                <button mat-fab color="warn" class="matFab3">
                    <mat-icon>home</mat-icon>
                </button>
            </div>
            <div class="example-button-container">
                <button mat-fab class="matFab4">
                    <mat-icon>home</mat-icon>
                </button>
            </div>
            <div class="example-button-container">
                <button mat-fab disabled>
                    <mat-icon>favorite</mat-icon>
                </button>
            </div>
        </div>
    </div>
</section>
<br><br>
<mat-divider></mat-divider>
<br><br>

<!---------------------------------------------------------------------------------------------
                                        Extended FAB Button
---------------------------------------------------------------------------------------------->
<div class="example-label">Extended Fab</div>
<div class="example-button-row">
    <div class="example-flex-container">
        <button mat-fab extended color="primary">
            <mat-icon>favorite</mat-icon> Primary </button>
        <button mat-fab extended color="accent">
            <mat-icon>favorite</mat-icon> Accent </button>
        <button mat-fab extended color="warn">
            <mat-icon>favorite</mat-icon> Warn </button>
        <button mat-fab extended class="matExtendedFab">
            <mat-icon>favorite</mat-icon> UnThemed </button>
        <button mat-fab extended disabled>
            <mat-icon>favorite</mat-icon> Disabled </button>
        <a mat-fab extended routerLink=".">
            <mat-icon>favorite</mat-icon> Link </a>
    </div>
</div>
<br><br>
<mat-divider></mat-divider>
